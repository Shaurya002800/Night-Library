name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/scanner.test.cjs
      - run: pip-audit --strict -r requirements.lock
      - run: docker build -t night-library:test .
