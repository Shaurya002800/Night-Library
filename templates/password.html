{% extends 'base.html' %}{% block title %}Account security{% endblock %}{% block content %}<section class="panel account-panel"><div class="eyebrow">ACCOUNT SECURITY</div><h1>Change your password</h1><p>Use at least 14 characters. Changing your password revokes every existing session.</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" maxlength="256" required><label for="new_password">New password</label><input id="new_password" name="new_password" type="password" minlength="14" maxlength="256" autocomplete="new-password" required><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="14" maxlength="256" autocomplete="new-password" required><button type="submit" class="button full">Update password</button></form></section>{% endblock %}
